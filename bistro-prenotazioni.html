<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nura - Serendipity Garden | Bistro Menu</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bistro-blue: #7B8DB8;
            --bistro-light: #A4B3D1;
            --bistro-purple: #9B8DB8;
            --cream: #F5F2E8;
            --dark-blue: #5A6B8A;
            --accent-gold: #D4AF37;
            --text-dark: #2C2C2C;
            --text-light: #FFFFFF;
            --shadow: rgba(0, 0, 0, 0.1);
            --whatsapp-green: #25D366;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #40461F;
            height: 100vh;
            color: var(--text-light);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 400px;
            width: 100%;
            height: calc(100vh - 40px);
            text-align: center;
            animation: fadeInUp 1s ease-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
        }

        /* Header */
        .header {
            flex-shrink: 0;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .header h1 {
            font-size: 1.125rem;
            font-weight: 300;
            margin-bottom: 2rem;
            color: var(--text-light);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-light);
            opacity: 0.9;
            font-weight: 300;
        }

        .address {
            font-size: 0.9rem;
            color: var(--text-light);
            opacity: 0.8;
            font-weight: 300;
            margin-top: 1rem;
        }

        .address a {
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .address a:hover {
            opacity: 1;
            color: var(--bistro-light);
            text-decoration: underline;
        }

        .address i {
            font-size: 0.8rem;
        }

        /* Menu Card */
        .menu-card {
            background: var(--bistro-light);
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-title {
            margin-bottom: 2rem;
        }

        .card-title img {
            max-width: 200px;
            height: auto;
        }

        /* Menu Buttons */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .menu-btn {
            background: var(--dark-blue);
            color: var(--text-light);
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            cursor: pointer;
        }

        .menu-btn:hover {
            background: var(--bistro-purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .menu-btn i {
            font-size: 1.1rem;
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            background: var(--whatsapp-green);
            color: var(--text-light);
        }

        .whatsapp-btn:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
        }

        /* Background Flower */
        .background-flower {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }

        .background-flower img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
                height: calc(100vh - 20px);
            }

            .menu-card {
                padding: 25px 20px;
            }

            .logo {
                width: 80px;
                height: 80px;
                margin-bottom: 1.5rem;
            }

            .logo img {
                width: 80px;
                height: 80px;
            }

            .header h1 {
                font-size: 1rem;
                margin-bottom: 1.5rem;
            }

            .card-title img {
                max-width: 180px;
            }

            .menu-btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }

            .background-flower {
                width: 250px;
                height: 250px;
                bottom: -40px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 5px;
                height: calc(100vh - 10px);
            }

            .menu-card {
                padding: 20px 15px;
            }

            .logo {
                width: 70px;
                height: 70px;
                margin-bottom: 1rem;
            }

            .logo img {
                width: 70px;
                height: 70px;
            }

            .header h1 {
                font-size: 0.9rem;
                margin-bottom: 1rem;
            }

            .card-title img {
                max-width: 160px;
            }

            .menu-btn {
                padding: 10px 15px;
                font-size: 0.85rem;
            }

            .background-flower {
                width: 200px;
                height: 200px;
                bottom: -30px;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

        <!-- Menu Card -->
        <div class="menu-card">

            <h2 class="card-title">
                <img src="bistrotext.png" alt="BISTRO">
            </h2>
            <div class="menu-buttons">
                <a href="bistro-it.pdf" class="menu-btn" target="_blank">

                </a>
                <a href="https://wa.me/+393758755300" class="menu-btn whatsapp-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i> Prenota un tavolo
                </a>
            </div>
        </div>
    </div>

    <!-- Background Flower -->
    <div class="background-flower">
        <img src="Vector (Stroke).png" alt="Background Flower">
    </div>
